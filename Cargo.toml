[package]
name = "ssh-gateway"
version = "0.1.0"
edition = "2021"
description = "Production-grade SSH gateway: russh dual-session relay pipe (username-as-route)."
license = "Apache-2.0"
publish = false

[lib]
name = "ssh_gateway"
path = "src/lib.rs"

[[bin]]
name = "ssh-gw"
path = "src/main.rs"

[dependencies]
# SSH transport: terminate client SSH (server role) and dial backend (client role).
# ring backend avoids the cmake/nasm toolchain that aws-lc-rs pulls on some hosts.
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "signal"] }
bytes = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Resolver cache (TTL + jitter + negative entries + single-flight get_with).
moka = { version = "0.12", features = ["future"] }

# Control-plane HTTP client with a pure-Rust TLS stack (no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Structured session identifiers (UUIDv7) that tie the two legs' logs together.
uuid = { version = "1", features = ["v7"] }

# JSON structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Key material for tests only (server/client host + credential keys).
rand = { version = "0.10", features = ["thread_rng"] }

# Certificate parsing/signing for the CA path (B1); same version russh already
# pulls in (`russh::keys` re-exports it, but the builder API is used directly).
ssh-key = { version = "0.7.0-rc.11", features = ["ed25519", "rsa", "std"] }

[dev-dependencies]
# `ChannelId`'s constructor is private to russh (deliberately), so tests build one
# by decoding it — the same path the library itself uses.
ssh-encoding = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
