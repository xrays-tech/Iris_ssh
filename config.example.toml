# SSH Gateway configuration sample — covers every field in propose.md §5.2.
#
# The gateway reads this from $SSHGW_CONFIG, the first CLI argument, or
# /etc/ssh-gateway/config.toml (in that order). All fields shown here are the
# documented defaults; omitted optional values fall back to these.

[listen]
addr = "0.0.0.0:2222"

# One entry per host key the gateway offers during KEX. Multiple algorithms are
# offered simultaneously (multi-key, propose §5.3). `state` is "active" (used to
# sign) or "passive" (advertised for learning, not primarily signed with).
[host_keys]
keys = [
  { path = "/etc/ssh-gw/host_ed25519", state = "active" },
  { path = "/etc/ssh-gw/host_rsa", state = "active" },
]

[relay]
window_size = "1MB"     # initial channel window, both legs (256KB..8MB)
max_packet = "32KB"     # max single packet payload (≤65535)
outbound_guard = true   # per-channel outbound Semaphore fuse (D5)
env_allowlist = []      # empty = pass env through (M1); non-empty filters names
# nodelay = true        # TCP_NODELAY on both SSH legs; default false (russh Nagle-on).
#                       # For dual-hop throughput, try true (Nagle+delayed-ACK micro-stall relief).
# ciphers = ["aes256-gcm", "chacha20-poly1305"]   # explicit symmetric cipher order on both legs;
#                       # empty = russh default (chacha20 first). A/B throughput knob.

# Gateway → backend authentication.
#
# The backend leg has exactly one credential: the *end user's* ssh-agent,
# forwarded from the client (`ssh -A` / `-o ForwardAgent=yes`). The gateway
# holds no key file of its own for the backend, and `direct-tcpip` / jump is
# removed, so there is no second path (plan-agent-only, propose §3.5.1).
#
# Per grant the control plane returns `policy.agent_forwarding`:
#   true  — the gateway forwards the agent and dials the backend with the
#           identity whose fingerprint that grant already authorized (never an
#           arbitrary key the agent happens to hold).
#   false — no session: the grant resolves, but the backend handshake is
#           refused instead of silently falling back to some gateway key.
#
# If the client forwarded no agent, or the agent cannot produce the authorized
# identity, the session fails outright. That is the design: there is no
# credential to fall back to.
[backend]
host_key_policy = "pinned"     # "pinned" (prod) | "accept-new" (onboarding)

# Opt-in connection pool. `enabled` must stay false: with one backend
# connection per session (agent passthrough), cross-session reuse has nothing
# to reuse, and propose §3.8 makes `enabled = true` an unconditionally invalid
# configuration. The dial circuit breaker and per-connection channel cap below
# still guard the per-session dial path either way.
[pool]
enabled = false
channels_per_conn = 8          # sshd MaxSessions-safe bound (≤8)
keepalive_interval = "15s"
keepalive_timeout = "5s"
keepalive_max_miss = 2
# Dial circuit breaker (§3.8): after this many consecutive dial failures to one
# `host:port`, further channel opens to it fail fast for the reset window.
circuit_failure_threshold = 5
circuit_reset_timeout = "30s"

# External control plane (resolve + authorize).
#
# Omittable when `[openstack] routing = "openstack_only"`: in that mode the
# gateway resolves nothing through this endpoint, and a config that carries no
# `[control_plane]` section at all is valid (plan-openstack MUST2). With any
# other routing — including the default, feature-off configuration — this
# section is required and its url must be non-empty.
[control_plane]
url = "https://cp.internal"
cache_ttl = "30s"
timeout = "2s"
# fail_open = false  # uncomment to serve stale grants when the CP is down

# --- OpenStack: instance UUID as the route (plan-openstack) -------------------
# DISABLED BY DEFAULT: with this section absent or `enabled = false` the
# gateway behaves exactly as before (the route predicate answers "control plane"
# for every principal), which is what keeps the feature byte-for-byte inert —
# and `enabled = false` is accepted whatever `routing`/`authorization` say.
#
# ⚠ Exactly ONE combination can be enabled today, and it is the laboratory one:
#
#     enabled = true
#     routing = "openstack_only"        # canonical instance UUIDs only, NO
#                                       # control-plane fallback for anything else
#     authorization = "openstack_only"  # Nova's project scope is the authority
#     allow_any_authenticated_key = true
#
# `authorization = "openstack_only"` means *any key that passes front-leg
# verification can reach any instance UUID it can guess*, limited only by the
# application credential's project scope — hence the deliberately alarming
# `allow_any_authenticated_key` flag, which the validator demands explicitly
# and on which the gateway warns at startup (plus another warning for plain
# http). Never enable it on a shared or internet-facing gateway; see
# `docs/known-limitations.md` §9 and `docs/ops-runbook.md` §5.8.
#
# The safe shapes are *parsed* but refused while the feature is on, because the
# control-plane authorization variant (plan-openstack §3.5 scheme A: control
# plane authorizes, Nova only maps UUID -> address) is NOT implemented:
#   - `routing = "hybrid"`            -> `openstack.routing` config error
#   - `authorization = "control_plane"` with an enabled route -> config error
# until scheme A lands, a hybrid route would authorize outside the control
# plane. The fields stay so that turning the section back off is never a
# two-step operation.
#
# The example below is the enabled lab shape, commented out. The target host
# always comes from Nova (never from the username), so this section cannot be
# used to dial an arbitrary address.
# [openstack]
# enabled = true
# routing = "openstack_only"
# authorization = "openstack_only"
# allow_any_authenticated_key = true
#
# # --- Keystone v3 (application credential is the recommended auth_method) ---
# auth_url = "https://keystone.example.internal:5000/v3"
# application_credential_id = "..."
# application_credential_secret = "..."   # or _file / $SSHGW_OPENSTACK_APPLICATION_CREDENTIAL_SECRET
# project_id = "..."                      # token scope = blast-radius gate
# region = "RegionOne"
# interface = "public"                    # public | internal | admin
# # nova_endpoint = "https://nova:8774/v2.1"   # skip catalog discovery (tests / internal clouds)
# microversion = "2.79"
#
# # --- transport / caching (independent of [control_plane]) ------------------
# timeout = "3s"
# cache_ttl = "30s"      # instance lookup cache; serving a stale address past
#                        # this TTL needs fail_open = true (red line 5)
# fail_open = false
# verify_tls = true
# # ca_bundle = "/etc/ssl/private/openstack-ca.pem"
#
# # --- address selection -----------------------------------------------------
# # network = "private"  # required when the instance has several networks
# address_family = "ipv4" # ipv4 | ipv6 | any
# prefer = "floating"     # floating | fixed | any
# on_ambiguous = "reject" # reject (default) | first
#
# # --- which principal shapes this route accepts -----------------------------
# # route_by = ["uuid"]  # (default) canonical instance UUID only — existing
# # # deployments keep resolving exactly as before.
# # Adding "name" opts into the instance-name route: a non-UUID principal that
# # satisfies the instance-name bound is resolved via `GET /servers?name=<value>`
# # (the name is a percent-encoded query value, never path material), and the
# # local exact-match filter decides the machine — Nova's `name` filter is a
# # substring search, and two instances sharing a name are refused, not guessed.
# # UUID-shaped principals always take the UUID path, never the name path.
# route_by = ["uuid", "name"]
#
# # --- backend login user (metadata wins, then rules, then this default) -----
# default_backend_user = "cloud-user"   # required while enabled
# backend_user_metadata_key = "iris_ssh_user"
#
# ssh_port = 22          # every instance's SSH port — instances do not carry one

[limits]
max_sessions = 10000
max_sessions_per_ip = 20
# Ceiling on the initial "none"-probe back-off: the first auth probe every SSH
# client sends is delayed by min(auth_timeout, auth_rejection_pad) (russh
# auth_rejection_time_initial). NOT the whole auth-phase budget (that's
# inactivity_timeout + max_auth_attempts). "0s" removes the per-connection
# initial back-off — production option for latency-sensitive pubkey
# deployments; the per-rejection pad below is retained (denied principals still
# pay ~1s each).
auth_timeout = "30s"
# Constant-time padding applied on *each* auth rejection, so a rejected key's
# latency doesn't leak why it was rejected. Deliberately independent of
# auth_timeout (originally the two were conflated, stalling every client ~30s).
auth_rejection_pad = "1s"
# Idle-session garbage collection; also the effective deadline for a peer that
# stalls mid-authentication (russh has no dedicated auth-phase timeout knob).
inactivity_timeout = "600s"
# Maximal number of allowed authentication attempts (anti-bruteforce). Russh's
# own encoding: 0 = unlimited. Default 10 matches russh's built-in default, so
# omitting it changes nothing.
max_auth_attempts = 10

[shutdown]
drain_wait = "60s"
disconnect_flush = "3s"
hard_deadline = "30s"

# Read-only observability endpoints: /healthz /readyz /metrics.
#
# Metrics naming note: `sshgw_relay_window_budget_bytes` reports the *reserved*
# relay window budget of live sessions (`active_sessions * relay.window_size *
# 2`) — a capacity-planning gauge, not live in-flight bytes. It was previously
# exposed as `sshgw_relay_inflight_bytes`; map the old name to the new one in any
# existing dashboard or alert.
[metrics]
addr = "127.0.0.1:9090"

# --- M3: certificate authority (propose §八 / host+user CA) -------------------
# Trusted CA **public** keys (authorized_keys format). One list serves both
# user certificates (`auth_openssh_certificate`) and backend host certificates
# (`@cert-authority`), because both anchor on the certificate's signing key.
# Verify-only: the gateway never signs, so there is no CA private key here —
# minting short-lived user certificates is the operator's tooling's job, not
# the gateway's. Omit the whole section to disable certificate authentication
# entirely.
# [ca]
# trusted_ca_keys = ["/etc/ssh-gw/ca_user.pub", "/etc/ssh-gw/ca_host.pub"]
#
# With a trusted CA present, the backend leg advertises the certificate
# algorithms that set can verify — so a backend that presents a `HostCertificate`
# is negotiated and verified by a four-step chain (signing key in the CA set →
# signature → validity window → principals include the host dialed). A host
# certificate naming a different host is refused even when its CA is trusted.

# --- M3: session recording (B2) ----------------------------------------------
# One file per channel: `<session-id>-<channel>.srec` in a 0700 directory, each
# file 0600. A recording is a packet capture of the session, so treat it as
# sensitive: keep the directory on private storage and out of shared paths, and
# give every replica its own so multiple instances can run side by side (B5).
[recording]
dir = "/var/lib/ssh-gateway/recordings"
max_bytes_per_session = 67108864   # 64 MiB; 0 disables recording entirely

# --- M3: SFTP command-level interception (B3) --------------------------------
# M1 pass-through by default. When enabled, the listed commands are refused and
# the client receives a protocol-native SFTP permission-denied status; path rules
# are applied to OPEN/REMOVE/RENAME/MKDIR/RMDIR/OPENDIR/REALPATH/LSTAT/STAT.
[intercept.sftp]
enabled = false
deny_commands = ["REMOVE", "RENAME"]
# allowed_path_prefixes = ["/data/"]      # empty = all paths allowed
# denied_path_prefixes = ["/data/secret"]

# NOTE: `direct-tcpip` / `forwarded-tcpip` (local/remote port forwarding) is
# always refused. The gateway is never an outbound pivot; there is no
# configuration that turns forwarding on. Every attempt is counted as
# `sshgw_direct_tcpip_denied_total`.
